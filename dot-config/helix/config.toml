theme = "base16_transparent"

[editor]
line-number = "relative"

[editor.cursor-shape]
insert = "bar"
normal = "underline"
select = "underline"

[editor.soft-wrap]
enable = true

[keys.normal]
"ret" = ":w"

C-y = [
	':sh rm -f /tmp/unique-ca1ea106',
	':insert-output yazi "%{buffer_name}" --chooser-file=/tmp/unique-ca1ea106',
	':sh printf "\x1b[?1049h\x1b[?2004h" > /dev/tty',
	':open %sh{cat /tmp/unique-ca1ea106}',
	':redraw',
	':set mouse false',
  ':set mouse true',
]

[keys.normal.space]
e = [
  ":sh rm -f /tmp/unique-file-h21a434",
  ":insert-output yazi '%{buffer_name}' --chooser-file=/tmp/helix-yazi-file",
  ":insert-output echo \"x1b[?1049h\" > /dev/tty",
  ":open %sh{cat /tmp/helix-yazi-file}",
  ":redraw",
  ":set mouse false",
  ":set mouse true",
]

